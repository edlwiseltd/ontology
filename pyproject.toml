[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autology"
version = "0.4.0"
description = "Ontology x Agent: ontology-driven, governed workflow automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
yaml = ["PyYAML"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
autology = "autology.__main__:main"

[tool.setuptools]
packages = ["autology"]

[tool.setuptools.package-data]
autology = ["static/*"]
