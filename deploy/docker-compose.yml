# Autology with the insurance example, plus optional Prometheus.
#   cp deploy/.env.example deploy/.env    # then put real secrets in deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile monitoring up -d   # also Prometheus on :9090
services:
  autology:
    build: ..
    image: autology:local
    env_file: .env
    ports: ["127.0.0.1:8800:8800"]    # put a TLS reverse proxy in front before exposing it
    volumes:
      - ../examples/auto_insurance:/config:ro    # server.json and the files it names
      - autology-data:/data                      # the store (back it up: `docker compose exec autology autology backup ...`)
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-token:/etc/prometheus/autology-token:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [autology]

volumes:
  autology-data:
