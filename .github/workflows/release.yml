name: release

# Push a tag such as v0.4.0 to publish: the wheel and source archive on a GitHub release, and the Docker image
# on GitHub Container Registry as ghcr.io/<owner>/<repo>:<version> and :latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the wheel and source archive
        run: |
          python -m pip install "build==1.2.2"
          python -m build

      - name: Build and smoke-test the image
        run: |
          docker build -t autology:release .
          deploy/smoke_test.sh autology:release

      - name: Push the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag autology:release "$image:$VERSION"
          docker tag autology:release "$image:latest"
          docker push "$image:$VERSION"
          docker push "$image:latest"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Autology $VERSION" --generate-notes
