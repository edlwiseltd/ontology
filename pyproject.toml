[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autology"
version = "0.4.0"
description = "Ontology x Agent: ontology-driven, governed workflow automation"
readme = "README.md"
license = {text = "Proprietary. See LICENSE."}
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
yaml = ["PyYAML"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
autology = "autology.__main__:main"

[tool.setuptools]
packages = ["autology"]

[tool.setuptools.package-data]
autology = ["static/*", "console_static/*", "blueprints/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# QA-1 (GAP-025): rules that find bugs, not style. CI fails on any of them.
select = ["E9", "F", "B006", "B008", "B012", "B015", "B018"]
